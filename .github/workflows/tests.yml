name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pytest python-dotenv fastapi uvicorn httpx python-multipart
      - name: Unit tests (offline, LLM mocked, no key needed)
        run: python -m pytest -q
      - name: Offline reports regenerate without a key
        run: |
          python eval/run_eval.py
          python eval/replay_lean.py
          python eval/writeup_check_eval.py --subs data/submissions --labels data/writeup_labels_dev.json --name dev
          python eval/writeup_check_eval.py --subs data/submissions_heldout --labels data/writeup_labels_heldout.json --name held-out
          python eval/writeup_check_eval.py --combine dev held-out
      - name: README numbers match the generated files
        run: python scripts/check_readme_numbers.py
      - name: Generated reports are committed and current
        run: git diff --exit-code -- eval/ || (echo "Regenerate eval/ reports and commit them" && exit 1)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
